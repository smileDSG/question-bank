航空航天、气象等大规模计算；微型机即个人计算机，是日常最常见的类型。四项均正确。"},{id:"q13",type:"blank",stem:"世界上第一台电子计算机的名字是 ______（填英文缩写）。",status:"todo",options:[],answer:"ENIAC",analysis:"ENIAC（Electronic Numerical Integrator And Computer，电子数值积分计算机）1946 年在美国宾夕法尼亚大学研制成功，是世界上第一台通用电子计算机。"}]},s3:{id:"s3",knowledgeName:"计算机系统的组成",counts:{single:2,multiple:1,blank:1},total:4,done:1,questions:[{id:"q14",type:"single",stem:"计算机硬件五大部件中，负责进行算术运算和逻辑运算的是（ ）。",status:"correct",options:[{key:"A",text:"控制器"},{key:"B",text:"运算器"},{key:"C",text:"存储器"},{key:"D",text:"输入设备"}],answer:"B",analysis:"运算器（ALU）负责算术运算和逻辑运算；控制器负责指挥协调各部件；存储器存放程序和数据；输入/输出设备负责与外界交换信息。运算器与控制器合起来就是 CPU。"},{id:"q15",type:"single",stem:"下列完全属于系统软件的一组是（ ）。",status:"wrong",options:[{key:"A",text:"Office、WPS"},{key:"B",text:"Windows、编译程序"},{key:"C",text:"微信、浏览器"},{key:"D",text:"游戏、播放器"}],answer:"B",analysis:"系统软件用于管理计算机资源并为应用软件提供支撑，包括操作系统、编译程序、数据库管理系统等。Windows 是操作系统，编译程序是系统软件；其余选项都是为解决具体应用问题而编写的应用软件。"},{id:"q16",type:"multiple",stem:"下列属于计算机硬件五大基本部件的有（ ）。",status:"doing",options:[{key:"A",text:"运算器"},{key:"B",text:"控制器"},{key:"C",text:"存储器"},{key:"D",text:"输入设备和输出设备"}],answer:["A","B","C","D"],analysis:"冯·诺依曼体系结构的硬件由五大部件组成：运算器、控制器、存储器、输入设备、输出设备。其中运算器与控制器构成中央处理器（CPU）。四项均属于五大部件。"},{id:"q17",type:"blank",stem:"计算机硬件中，负责指挥和协调各部件按序工作的部件是 ______。",status:"todo",options:[],answer:"控制器",analysis:"控制器是计算机的指挥中心，它从存储器取出指令、分析指令，并向其他部件发出控制信号，协调整机有条不紊地工作。它与运算器共同组成 CPU。"}]},s4:{id:"s4",knowledgeName:"数据结构概述",counts:{single:2,multiple:1,blank:1},total:4,done:3,questions:[{id:"q18",type:"single",stem:"下列属于逻辑结构的是（ ）。",status:"correct",options:[{key:"A",text:"顺序存储"},{key:"B",text:"链式存储"},{key:"C",text:"树形结构"},{key:"D",text:"索引存储"}],answer:"C",analysis:"逻辑结构描述数据元素之间的逻辑关系，与计算机无关，包括集合、线性、树形、图形结构。顺序存储、链式存储、索引存储都是把逻辑结构落实到计算机中的存储（物理）结构。"},{id:"q19",type:"single",stem:"下列哪一项不属于数据的存储结构？（ ）",status:"correct",options:[{key:"A",text:"顺序存储"},{key:"B",text:"链式存储"},{key:"C",text:"线性结构"},{key:"D",text:"索引存储"}],answer:"C",analysis:"存储结构（物理结构）主要有顺序存储、链式存储、索引存储和散列存储。线性结构属于逻辑结构，反映的是元素间一对一的
